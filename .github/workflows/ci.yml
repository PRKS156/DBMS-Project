name: MedRelay Continuous Integration & Verification

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  verify-build:
    name: Build, Lint & Verify Schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies & Generate Prisma
        working-directory: ./backend
        run: |
          npm ci
          npx prisma generate

      - name: Install Frontend Dependencies & Build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Verify Environment Secrets Configuration
        run: |
          echo "Verifying environment isolation and secrets hygiene..."
          test ! -f backend/.env || echo "Local .env isolated"


      - name: Security and table query regression tests
        run: |
          npm --prefix backend test
          node --test frontend/src/utils/tableQuery.test.js
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Validate database schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/medrelay
        run: npx prisma validate
